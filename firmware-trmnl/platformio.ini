; TRMNL X firmware — ESP32-S3, 10.3" 1872x1404 parallel e-paper, 16-level
; grayscale via FastEPD. Sibling of ../firmware-cloud (the Xteink X3, 1-bit,
; SPI/SSD1677, ESP32-C3) — totally different silicon + panel, hence a separate
; project. See README.md.

[platformio]
default_envs = trmnl_x
extra_configs = platformio.local.ini

[env:trmnl_x]
; pioarduino build of Arduino-ESP32 (IDF 5.x) — same platform the official
; usetrmnl/trmnl-firmware [env:TRMNL_X] uses.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; ESP32-S3 with 16MB flash + 8MB octal PSRAM (the framebuffer lives in PSRAM).
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTRMNL_X=1
    -Isrc/fonts
    -std=gnu++2a
build_unflags =
    -std=gnu++11

lib_deps =
    ; Parallel e-paper driver for the TRMNL X panel. Pinned to the exact commit
    ; the official firmware ships so the panel timing + BB_PANEL_TRMNL_X profile
    ; match the hardware. (Falls back cleanly to `bitbank2/FastEPD@^2.2.0`.)
    https://github.com/bitbank2/FastEPD.git#855ce9a42c0be5cd8ce2f2425483a8271a04668d
    ricmoo/QRCode@^0.0.1
