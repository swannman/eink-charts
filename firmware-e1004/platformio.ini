; reTerminal E1004 firmware — ESP32-S3 (32 MB quad flash, 8 MB OPI PSRAM),
; 13.3" 1200x1600 E Ink Spectra 6 color panel via Seeed_GFX's EPaper driver
; (T133A01, BOARD_SCREEN_COMBO 523). Sibling of ../firmware-trmnl (TRMNL X,
; grayscale/FastEPD) — same bundle pipeline, color wire format (v3).

[platformio]
default_envs = e1004
extra_configs = platformio.local.ini

[env:e1004]
; pioarduino build of Arduino-ESP32 (IDF 5.x) — same platform as firmware-trmnl.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 32 MB quad flash + 8 MB octal (OPI) PSRAM — per esptool flash_id. USB is a
; CH340 UART bridge (no native CDC): Serial is UART0, no CDC flags needed.
board_build.flash_mode = qio
board_upload.flash_size = 32MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Seeed_GFX board+screen combo: reTerminal E1004 (Setup523, T133A01).
    -DBOARD_SCREEN_COMBO=523
    ; Seeed_GFX's sprite allocator gates PSRAM on the pre-IDF5 kconfig name;
    ; without this the 960 KB 4bpp panel sprite tries (and fails) to come from
    ; the 512 KB internal SRAM.
    -DCONFIG_SPIRAM_SUPPORT=1
    -std=gnu++2a
build_unflags =
    -std=gnu++11

lib_deps =
    ; Seeed's TFT_eSPI fork with the ePaper extension + T133A01 (13.3" Spectra
    ; 6) driver. Pinned for reproducibility.
    https://github.com/Seeed-Studio/Seeed_GFX.git#a2de1abca0597c202193f22d01e9fa35d1ff613b
    ; GFXfont structs + FreeSans/FreeSansBold faces used by src/gfxc.cpp.
    adafruit/Adafruit GFX Library@^1.11.9
    ricmoo/QRCode@^0.0.1
